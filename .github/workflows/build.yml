name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    # Intel runner: TurboFan and its kext are x86_64 only.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build app, CLI, helper and kext
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TurboFan
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: |
            dist/*.zip
            dist/*.sha256
